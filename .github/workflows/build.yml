name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install automake autoconf
          else
            sudo apt-get update
            sudo apt-get install -y automake autoconf
          fi

      - name: Regenerate the build system
        run: autoreconf -i

      # No -std=gnu89, -fcommon or -Wno-* here on purpose: the tree is
      # meant to build clean with the compiler's own defaults, and this
      # job is what keeps it that way.
      - name: Configure
        run: |
          ./configure --prefix="$HOME/sisal" --disable-fortran \
                      --enable-warnings CC=${{ matrix.cc }}

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Fail on old-style definitions
        run: |
          make clean >/dev/null
          make -j"$(getconf _NPROCESSORS_ONLN)" 2>&1 | tee build.log
          # These two are what stops the tree compiling as C23, so they are
          # errors here even though the rest of the warning set is advisory.
          if grep -E 'warning:.*(old-style (function )?definition|strict-prototypes|deprecated-non-prototype)' build.log; then
            echo "::error::old-style function definitions reintroduced"
            exit 1
          fi

      - name: Install
        run: make install

      # sisalc resolves its tables and runtime relative to the install
      # prefix, so it cannot run from the build tree; check must follow
      # install.
      - name: Test
        run: make check || { find . -name '*.log' -newer Makefile -exec tail -n 40 {} +; exit 1; }

      - name: Compile and run a program end to end
        run: |
          export PATH="$HOME/sisal/bin:$PATH"
          cat > squares.sis <<'SIS'
          define Main
          type IntArray = array [integer];
          function Main(N: integer returns IntArray)
            for i in 1, N
              returns array of i * i
            end for
          end function
          SIS
          sisalc -o squares squares.sis
          echo 8 | ./squares | tee out.txt
          grep -q '1 4 9 16 25 36 49 64' out.txt

      - name: Check the generated C still compiles as C23
        if: matrix.cc == 'clang'
        run: |
          export PATH="$HOME/sisal/bin:$PATH"
          sisalc -C -w squares.sis
          clang -std=c2x -fsyntax-only -I"$HOME/sisal/include/sisal" squares.c

  zig:
    name: zig cc / --with-tuning=${{ matrix.tuning }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tuning: [baseline, aggressive]

    steps:
      - uses: actions/checkout@v4

      - name: Install autotools
        run: sudo apt-get update && sudo apt-get install -y automake autoconf

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - name: Regenerate the build system
        run: autoreconf -i

      # zig cc is clang with its own bundled headers and libc, so this is the
      # job that catches anything relying on a GCC-only extension.  The
      # aggressive profile additionally exercises thin LTO, which only links
      # if LD follows CC.
      - name: Configure
        run: |
          ./configure --prefix="$HOME/sisal" --disable-fortran \
                      CC="zig cc" --with-tuning=${{ matrix.tuning }}

      - name: Build
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Install
        run: make install

      - name: Test
        run: make check || { find . -name '*.log' -newer Makefile -exec tail -n 40 {} +; exit 1; }

      # The tuning profile is baked into SISAL_CFLAGS, so a program compiled
      # here picks it up with no flags of its own.  Check that it still gets
      # the right answer.
      - name: Compile and run a program with the tuned toolchain
        run: |
          export PATH="$HOME/sisal/bin:$PATH"
          cat > squares.sis <<'SIS'
          define Main
          type IntArray = array [integer];
          function Main(N: integer returns IntArray)
            for i in 1, N
              returns array of i * i
            end for
          end function
          SIS
          sisalc -o squares squares.sis
          echo 8 | ./squares | tee out.txt
          grep -q '1 4 9 16 25 36 49 64' out.txt


  freebsd:
    name: freebsd / gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FreeBSD has no first-party GitHub-hosted runner, so this boots a real
      # FreeBSD VM on top of the ubuntu-latest host and runs the build inside
      # it.  Everything from here down executes as FreeBSD, not Linux.
      - name: Build and test inside a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y autoconf automake gmake
          run: |
            set -e
            autoreconf -i
            ./configure --prefix="$HOME/sisal" --disable-fortran
            gmake -j"$(sysctl -n hw.ncpu)"
            gmake install
            gmake check || { find . -name '*.log' -newer Makefile -exec tail -n 40 {} +; exit 1; }

            export PATH="$HOME/sisal/bin:$PATH"
            cat > squares.sis <<'SIS'
            define Main
            type IntArray = array [integer];
            function Main(N: integer returns IntArray)
              for i in 1, N
                returns array of i * i
              end for
            end function
            SIS
            sisalc -o squares squares.sis
            echo 8 | ./squares | tee out.txt
            grep -q '1 4 9 16 25 36 49 64' out.txt

  windows:
    name: windows / mingw
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # A real native build, not a cross-compile: this is what actually
      # exercises the configure-time probes (sched_yield, the clock-tick
      # fallback chain) that a cross build can only simulate.  MINGW64 gives
      # a native x86_64 Windows toolchain plus the usual POSIX build tools.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            autoconf
            automake
            make
            mingw-w64-x86_64-gcc

      - name: Regenerate the build system
        run: autoreconf -i

      - name: Configure
        run: ./configure --prefix="$HOME/sisal" --disable-fortran

      - name: Build
        run: make -j"$(nproc)"

      - name: Install
        run: make install

      # sisalc spawns each compiler phase as a subprocess (fork+exec on
      # POSIX, _spawnvp here), so this is the job that actually exercises
      # that path on Windows, not just the C library gaps.
      - name: Test
        run: make check || { find . -name '*.log' -newer Makefile -exec tail -n 40 {} +; exit 1; }

      - name: Compile and run a program end to end
        run: |
          export PATH="$HOME/sisal/bin:$PATH"
          cat > squares.sis <<'SIS'
          define Main
          type IntArray = array [integer];
          function Main(N: integer returns IntArray)
            for i in 1, N
              returns array of i * i
            end for
          end function
          SIS
          sisalc -o squares squares.sis
          echo 8 | ./squares | tee out.txt
          grep -q '1 4 9 16 25 36 49 64' out.txt
